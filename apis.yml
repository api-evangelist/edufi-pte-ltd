name: EDUFI PTE. LTD
description: >-
  EduFi (EDUFI PTE. LTD) is a Singapore-incorporated education-financing fintech operating Pakistan's
  first Study Now, Pay Later (SNPL) digital platform, with expansion into Saudi Arabia and Oman. The
  Shariah-approved platform lets parents and students finance private schooling, higher education, and
  international student loans through quick, collateral-free approvals with direct disbursement to
  educational institutes and convenient monthly installments. EduFi also provides partner educational
  institutes a free ERP system and subsidized SNPL for their students, and works with financial
  institutions to fund receivables. Backed by 500 Global. This profile is maintained by API Evangelist;
  EduFi publishes a consumer marketing and application surface but no public developer/API program.
